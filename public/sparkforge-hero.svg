<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
<title id="title">Sparkforge faceted crystal and connected engineering network</title><desc id="desc">A dimensional faceted navy and orange crystal with a luminous gold centre, fine gold network connections and flowing navy and orange ribbons, inspired by the approved Sparkforge brand moodboard.</desc>
<defs>
