<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0b8"/><stop offset=".45" stop-color="#dca94b"/><stop offset="1" stop-color="#9e681c"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#fff9db" stop-opacity="1"/><stop offset=".18" stop-color="#ffcb63" stop-opacity=".9"/><stop offset=".52" stop-color="#f07832" stop-opacity=".2"/><stop offset="1" stop-color="#f07832" stop-opacity="0"/></radialGradient>
<filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
